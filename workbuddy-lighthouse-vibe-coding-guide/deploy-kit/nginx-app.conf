# ============================================================
# Nginx 反向代理配置模板
# 放置路径：/etc/nginx/conf.d/app.conf
# 生效：sudo nginx -t && sudo systemctl reload nginx
#
# 说明：本文件只管 HTTP 层。
#   HTTPS 由 certbot 自动写入（sudo certbot --nginx -d 域名 --redirect），
#   或由 Coolify / Dokploy 内置 Traefik 自动接管。
# ============================================================

upstream my_vibe_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    # certbot 的 ACME 校验路径，保留即可
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 上传体积上限（按业务调整）
    client_max_body_size 20m;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://my_vibe_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 健康检查直接透传，便于外部探活
    location = /healthz {
        proxy_pass http://my_vibe_app/healthz;
        access_log off;
    }

    # 静态资源缓存（有 /static 目录时启用）
    location /static/ {
        proxy_pass http://my_vibe_app/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
