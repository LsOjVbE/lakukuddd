# ============================================================
# 服务编排示例
# 关键点：
#   1. 端口绑定 127.0.0.1 —— 只让反向代理访问，不直接暴露公网
#      （Docker 会绕过 ufw 写 iptables，务必从这里限制）
#   2. restart: unless-stopped —— 异常退出与机器重启后自动拉起
#   3. 数据卷持久化 —— 容器可重建，数据不丢
# ============================================================
services:
  app:
    build: .
    image: my-vibe-app:latest
    container_name: my-vibe-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 需要反向代理时启用（若使用 Coolify / Dokploy，其内置 Traefik 已接管，可删掉本段）
